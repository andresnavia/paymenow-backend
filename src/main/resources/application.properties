# ============================
# Datos generales de la app
# ============================
spring.application.name=paymenow-backend
server.port=8080

# ============================
# Conexion a MySQL (entorno local)
# ============================
spring.datasource.url=jdbc:mysql://localhost:3306/PAYMENOW?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1144177959
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================
# JPA / Hibernate
# ============================
# ddl-auto=none porque la estructura ya se crea con el script .sql que tienes.
# Si quieres que Hibernate valide que las entidades coincidan con las tablas, usa "validate".
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================
# Manejo de errores
# ============================
server.error.include-message=always
server.error.include-binding-errors=always

# ============================
# CORS (frontend)
# ============================
app.cors.allowed-origins=http://localhost:5173

# ============================
# Swagger / OpenAPI
# ============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH}